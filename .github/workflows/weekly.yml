name: 週1回の WordPress 公開（確認済みのものだけ）

# 毎週日曜 5:00（日本時間）に、確認済み（ledger の ready）で未送信の記事を1本、WordPress へ公開する。
# 記事の作成はしない（作成は手元で行い、確認したものだけを GitHub に push して ready を付ける）。
# Gemini と外部の言語モデル API は使わない。
#
# 必要な Secrets: WP_POST_EMAIL, SMTP_USER, SMTP_PASSWORD

on:
  schedule:
    - cron: '0 20 * * 6'   # 土曜 20:00 UTC = 日曜 05:00 (Asia/Tokyo)
  workflow_dispatch:
    inputs:
      dir:
        description: 'reports/ の下のフォルダ名（空なら、確認済みで未送信の最も古いもの）'
        type: string
        default: ''
      draft:
        description: '下書きとして送る（見え方の確認用。台帳は更新しない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wordpress-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: 公開（確認済みの記事）
        env:
          WP_POST_EMAIL: ${{ secrets.WP_POST_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          args=""
          [ -n "${{ inputs.dir }}" ] && args="$args --dir ${{ inputs.dir }}"
          [ "${{ inputs.draft }}" = "true" ] && args="$args --draft"
          node send-wp.js $args

      - name: 台帳と一覧を更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in ledger.json reports/README.md; do [ -e "$p" ] && git add "$p"; done
          if ! git diff --cached --quiet; then
            git commit -m "Record WordPress post"
            git push
          fi
